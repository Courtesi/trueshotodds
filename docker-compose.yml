services:
  redis:
    image: redis:7-alpine
    container_name: tso-redis
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    command: redis-server --appendonly yes
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      timeout: 10s
      retries: 5
    networks:
      - app-network

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: tso-backend
    volumes:
      - ./backend/secrets/service-account.json:/app/secrets/service-account.json:ro
    environment:
      - ENV=production
      - GOOGLE_APPLICATION_CREDENTIALS=/app/secrets/service-account.json
      - REDIS_HOST=redis
    env_file:
      - ./backend/secrets/.env
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - app-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/python/health').read()"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  webscraper:
    build:
      context: ./webscraper
      dockerfile: Dockerfile
    container_name: tso-webscraper
    depends_on:
      redis:
        condition: service_healthy
    env_file:
      - ./webscraper/.env
    environment:
      - REDIS_HOST=redis
    networks:
      - app-network
    restart: unless-stopped
    
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_URL: https://trueshotodds.com
    container_name: tso-frontend
    env_file:
      - ./frontend/.env
    environment:
      VITE_API_URL: https://trueshotodds.com
    ports:
      - "5173:3000"
    networks:
      - app-network
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy


volumes:
  redis-data:
    driver: local

networks:
  app-network:
    driver: bridge