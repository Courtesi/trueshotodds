services:
  # ============================================================================
  # WEBSCRAPER WORKERS - Each sportsbook runs as independent service
  # ============================================================================

  worker-fliff:
    build:
      context: ./webscraper
      dockerfile: Dockerfile
    container_name: tso-worker-fliff
    command: uv run python -m arbfinder.worker.generic_worker --sportsbook fliff --interval ${FLIFF_SI}
    depends_on:
      redis:
        condition: service_healthy
    environment:
      - REDIS_HOST=redis
    env_file:
      - ./webscraper/.env
    networks:
      - app-network
    # restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 128M
          cpus: '0.1'

  worker-novig:
    build:
      context: ./webscraper
      dockerfile: Dockerfile
    container_name: tso-worker-novig
    command: uv run python -m arbfinder.worker.generic_worker --sportsbook novig --interval ${NOVIG_SI}
    depends_on:
      redis:
        condition: service_healthy
    environment:
      - REDIS_HOST=redis
    env_file:
      - ./webscraper/.env
    networks:
      - app-network
    # restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 128M
          cpus: '0.1'

  worker-prophetx:
    build:
      context: ./webscraper
      dockerfile: Dockerfile
    container_name: tso-worker-prophetx
    command: uv run python -m arbfinder.worker.generic_worker --sportsbook prophetx --interval ${PROPHETX_SI}
    depends_on:
      redis:
        condition: service_healthy
    environment:
      - REDIS_HOST=redis
    env_file:
      - ./webscraper/.env
    networks:
      - app-network
    # restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 128M
          cpus: '0.1'

  worker-draftkings:
    build:
      context: ./webscraper
      dockerfile: Dockerfile
    container_name: tso-worker-draftkings
    command: uv run python -m arbfinder.worker.generic_worker --sportsbook draftkings --interval ${DRAFTKINGS_SI}
    depends_on:
      redis:
        condition: service_healthy
    environment:
      - REDIS_HOST=redis
    env_file:
      - ./webscraper/.env
    networks:
      - app-network
    # restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 128M
          cpus: '0.1'

  worker-betmgm:
    build:
      context: ./webscraper
      dockerfile: Dockerfile
      args:
        INSTALL_PLAYWRIGHT: "true"
    container_name: tso-worker-betmgm
    command: uv run python -m arbfinder.worker.generic_worker --sportsbook betmgm --interval ${BETMGM_SI:-60}
    depends_on:
      redis:
        condition: service_healthy
    environment:
      - REDIS_HOST=redis
    env_file:
      - ./webscraper/.env
    networks:
      - app-network
    # restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 512M  # BetMGM needs more memory for Playwright browser
          cpus: '0.5'

  worker-fanduel:
    build:
      context: ./webscraper
      dockerfile: Dockerfile
    container_name: tso-worker-fanduel
    command: uv run python -m arbfinder.worker.generic_worker --sportsbook fanduel --interval ${FANDUEL_SI}
    depends_on:
      redis:
        condition: service_healthy
    environment:
      - REDIS_HOST=redis
    env_file:
      - ./webscraper/.env
    networks:
      - app-network
    # restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 128M
          cpus: '0.1'

  worker-caesars:
    build:
      context: ./webscraper
      dockerfile: Dockerfile
    container_name: tso-worker-caesars
    command: uv run python -m arbfinder.worker.generic_worker --sportsbook caesars --interval ${CAESARS_SI}
    depends_on:
      redis:
        condition: service_healthy
    environment:
      - REDIS_HOST=redis
    env_file:
      - ./webscraper/.env
    networks:
      - app-network
    # restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 128M
          cpus: '0.1'

  # ============================================================================
  # ARBFINDER - Main aggregation service
  # ============================================================================

  arbfinder:
    build:
      context: ./webscraper
      dockerfile: Dockerfile
    container_name: tso-arbfinder
    command: uv run python main.py --mode distributed
    depends_on:
      redis:
        condition: service_healthy
    environment:
      - REDIS_HOST=redis
    env_file:
      - ./webscraper/.env
    networks:
      - app-network
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 384M
          cpus: '0.5'

  # ============================================================================
  # WEBSITE LAYERS
  # ============================================================================

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_URL: https://trueshotodds.com
    container_name: tso-frontend
    env_file:
      - ./frontend/.env
    environment:
      VITE_API_URL: https://trueshotodds.com
    ports:
      - "5173:3000"
    networks:
      - app-network
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: '0.1'

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: tso-backend
    volumes:
      - ./backend/service-account.json:/app/service-account.json:ro
    environment:
      - ENV=production
      - GOOGLE_APPLICATION_CREDENTIALS=/app/service-account.json
      - REDIS_HOST=redis
    env_file:
      - ./backend/.env
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - app-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/python/health').read()"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: '0.2'

  # ============================================================================
  # SUPPORTING SERVICES
  # ============================================================================

  redis:
    image: redis:7-alpine
    container_name: tso-redis
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    command: redis-server --appendonly yes
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      timeout: 10s
      retries: 5
    networks:
      - app-network
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: '0.2'
  
  dozzle:
    image: amir20/dozzle:latest
    container_name: tso-dozzle
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ./data:/data
    ports:
      - 8080
    environment:
      DOZZLE_AUTH_PROVIDER: forward-proxy
      DOZZLE_AUTH_HEADER_USER: Cf-Access-Authenticated-User-Email
      DOZZLE_AUTH_HEADER_EMAIL: Cf-Access-Authenticated-User-Email
      DOZZLE_AUTH_HEADER_NAME: Cf-Access-Authenticated-User-Email
    restart: unless-stopped
    networks:
      - app-network

  cloudflared:
    container_name: tso-cloudflared
    image: cloudflare/cloudflared:latest
    command: tunnel --no-autoupdate run
    environment:
      - TUNNEL_TOKEN=${CLOUDFLARE_TUNNEL_TOKEN}
    networks:
      - app-network
    restart: unless-stopped

volumes:
  redis-data:
    driver: local

networks:
  app-network:
    driver: bridge